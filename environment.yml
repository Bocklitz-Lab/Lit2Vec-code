name: lit2vec
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.2.2+cu118  # or adapt to your CUDA version
      - torchvision==0.17.2+cu118
      - torchaudio==2.2.2+cu118
      - --extra-index-url https://download.pytorch.org/whl/cu118

      # Core NLP + embeddings
      - transformers==4.41.2
      - sentence-transformers==2.7.0
      - accelerate==0.31.0

      # Tokenizer support
      - tokenizers==0.19.1

      # Data processing
      - tqdm==4.66.4
      - numpy==1.26.4
      - zstandard==0.22.0
      - pynvml==11.5.0
      - datasets==2.21.0
      - scikit-learn==1.5.0

      # Optional utilities
      - rich==13.7.1
      - pandas==2.2.2
      - jsonlines==4.0.0
      - orjson==3.10.3

      # Linting / typing (optional for dev)
      - mypy
      - ruff
