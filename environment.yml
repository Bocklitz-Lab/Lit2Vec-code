name: lit2vec
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # NLP + tokenization
  - nltk
  - spacy
  - huggingface_hub
  - transformers
  - sentence-transformers
  - datasets
  - accelerate
  - tokenizers
  - sacremoses
  - tqdm

  # Vector handling
  - faiss-cpu             # Or faiss-gpu if needed
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # Compression & storage
  - zstandard
  - pyarrow
  - orjson
  - rapidjson

  # Data validation
  - jsonschema
  - pydantic

  # Plotting (for figures & validation)
  - matplotlib
  - seaborn

  # Web / scraping / I/O
  - requests
  - lxml
  - beautifulsoup4
  - aiohttp
  - tqdm

  # Dev & testing
  - pytest
  - flake8
  - mypy
  - pre-commit

  # Optional: summarization / model training
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-lightning

  # Optional: Jupyter
  - jupyterlab
  - ipywidgets
